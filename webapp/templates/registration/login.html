<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Acquisition Agent</title><style>body{margin:0;background:#f4f7fa;font-family:Inter,system-ui,sans-serif;color:#172033;display:grid;place-items:center;min-height:100vh}.card{background:white;border:1px solid #e4eaf1;border-radius:16px;padding:34px;width:min(390px,calc(100% - 40px));box-shadow:0 12px 40px #162b4612}h1{font-size:24px;margin:0 0 8px}.muted{color:#718096;font-size:14px}label{display:block;font-size:13px;font-weight:650;margin:18px 0 7px}input{width:100%;padding:12px;border:1px solid #d8e0e9;border-radius:8px;font-size:15px}button{width:100%;border:0;border-radius:8px;background:#176b50;color:white;padding:13px;font-weight:700;margin-top:22px;cursor:pointer}.error{color:#b42318;font-size:13px}</style></head><body><form class="card" method="post">{% csrf_token %}<h1>Welcome back</h1><p class="muted">Sign in to your Acquisition Agent workspace.</p>{% if form.errors %}<p class="error">Your username or password was incorrect.</p>{% endif %}<label for="id_username">Username</label>{{ form.username }}<label for="id_password">Password</label>{{ form.password }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">Sign in</button></form></body></html>
