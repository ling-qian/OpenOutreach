<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Acquisition Agent{% endblock %}</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#172033;background:#f6f8fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{display:flex;min-height:100vh}.side{width:248px;background:#111b2e;color:#d7deea;padding:28px 18px;flex-shrink:0}.brand{font-size:18px;font-weight:750;color:white;margin:0 10px 34px}.brand span{color:#6ee7b7}.nav a{display:block;color:#aebbd0;text-decoration:none;padding:12px 14px;border-radius:9px;margin:4px 0;font-size:14px}.nav a.active,.nav a:hover{background:#22314b;color:white}.main{flex:1;min-width:0;padding:34px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#75839a;font-weight:700}.h1{font-size:28px;margin:5px 0 0;letter-spacing:-.04em}.muted{color:#718096}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #e6ebf2;border-radius:14px;padding:20px;box-shadow:0 2px 8px #1d35570a}.metric{font-size:30px;font-weight:750;margin-top:10px}.section{margin:26px 0 12px;font-size:16px;font-weight:700}.table{width:100%;border-collapse:collapse;background:white;border:1px solid #e6ebf2;border-radius:12px;overflow:hidden}.table th,.table td{text-align:left;padding:14px 16px;border-bottom:1px solid #edf0f5;font-size:13px}.table th{color:#718096;background:#fafbfd;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eaf8f1;color:#13734b;font-size:11px;font-weight:700}.empty{padding:40px;text-align:center;color:#718096}.toolbar{display:flex;gap:10px;align-items:center}.btn{background:#176b50;color:white;text-decoration:none;padding:10px 14px;border-radius:9px;font-size:13px;font-weight:650}.notice{padding:16px;background:#eef6ff;border-radius:10px;color:#36577e;font-size:13px;margin:18px 0}@media(max-width:850px){.side{width:190px}.main{padding:26px 20px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shell{display:block}.side{width:100%;padding:14px}.brand{margin:4px 8px 12px}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap}.main{padding:22px 15px}.grid{grid-template-columns:repeat(2,1fr)}.h1{font-size:24px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">acquisition<span>.</span>ai</div><nav class="nav"><a href="/" class="{% if request.path == '/' %}active{% endif %}">Overview</a><a href="/leads/" class="{% if request.path == '/leads/' %}active{% endif %}">Find leads</a><a href="/opportunities/" class="{% if request.path == '/opportunities/' %}active{% endif %}">Opportunities</a><a href="/settings/" class="{% if request.path == '/settings/' %}active{% endif %}">Service profile</a></nav></aside><main class="main"><div class="top"><div><div class="eyebrow">AI Acquisition Agent</div><h1 class="h1">{% block heading %}Overview{% endblock %}</h1></div><div class="muted" style="font-size:13px">{{ request.user.username }}</div></div>{% if messages %}{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></div></body></html>
